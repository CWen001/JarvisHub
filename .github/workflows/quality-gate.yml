name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch upstream compatibility baseline
        run: |
          git remote add upstream https://github.com/LYL1015/JarvisHub.git || true
          git fetch --no-tags upstream main:refs/remotes/upstream/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Run guards
        run: |
          node scripts/guards/no-merge-conflict-markers.mjs
          node scripts/guards/no-debugger-statement.mjs
          node scripts/upstream-compatibility/upstream-compatibility.mjs

      - name: Verify upstream replayability
        run: pnpm run verify:upstream-replay -- --no-tests --report /tmp/upstream-replay-report.md

      - name: Run guards and core tests
        run: pnpm run test

      - name: Build web app
        run: pnpm run build:web
